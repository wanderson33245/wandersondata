<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Tire Tech | William Anderson</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0B0C;
    --amber: #E8A33D;
    --steel: #5B6B73;
    --text: #F2F2F0;
    --text-dim: #A8ADB0;
    --line: rgba(91, 107, 115, 0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    line-height: 1.6;
    padding: 3rem 1.5rem 5rem;
  }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding-top: 1rem;
  }

  .gallery {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 2.5rem 2rem;
    padding: 1rem;
  }

  figure {
    background: #151517;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    width: 44%;
    min-width: 320px;
    flex-grow: 1;
  }

  figure:nth-child(1) { margin-top: 0.5rem; }
  figure:nth-child(2) { margin-top: 1.5rem; }
  figure:nth-child(3) { margin-top: 0.25rem; }
  figure:nth-child(4) { margin-top: 2rem; }
  figure:nth-child(5) { margin-top: 0.75rem; }
  figure:nth-child(6) { margin-top: 1.75rem; }
  figure:nth-child(7) { margin-top: 0.5rem; }
  figure:nth-child(8) { margin-top: 1.25rem; }
  figure:nth-child(9) { margin-top: 0.9rem; }

  .photo-slot {
    aspect-ratio: 16 / 9;
    background: #1B1B1E;
    border-bottom: 1px dashed var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 0.8rem;
    text-align: center;
    padding: 1rem;
  }

  figcaption {
    padding: 0.9rem 1.1rem;
    font-size: 0.92rem;
    color: var(--text-dim);
    font-style: italic;
  }

  footer {
    text-align: center;
    margin-top: 4rem;
    color: var(--text-dim);
    font-size: 0.85rem;
  }
</style>
</head>
<body>

<main>
  <div class="gallery">
    <figure>
      <div class="photo-slot"><img src="assets/TireTech/YouAreYourOwnBiggestAcle.jpg" alt="Your Are Your Own Biggest Acle." style="width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block;"></div>
      <figcaption>"You Are Your Own Biggest Acle"</figcaption>
    </figure>
    <figure>
      <div class="photo-slot"><img src="assets/TireTech/Horses.jpg" alt="Horses" style="width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block;"></div>
      <figcaption></figcaption>
    </figure>
    <figure>
      <div class="photo-slot"><img src="assets/TireTech/Jort.jpg" alt="Jort" style="width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block;"></div>
      <figcaption></figcaption>
    </figure>
    <figure>
      <div class="photo-slot"><img src="assets/TireTech/Shmort.jpg" alt="Shmort" style="width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block;"></div>
      <figcaption></figcaption>
    </figure>
    <figure>
      <div class="photo-slot"><img src="assets/TireTech/Desk.jpg" alt="Desk" style="width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block;"></div>
      <figcaption>My "desk" down in Grandview's lube bay</figcaption>
    </figure>
    <figure>
      <div class="photo-slot"><img src="assets/TireTech/AirFilter.jpg" alt="Air Filter" style="width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block;"></div>
      <figcaption></figcaption>
    </figure>
    <figure>
      <div class="photo-slot"><img src="assets/TireTech/Jart.jpg" alt="Jart" style="width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block;"></div>
      <figcaption></figcaption>
    </figure>
    <figure>
      <div class="photo-slot"><img src="assets/TireTech/LeBrort.jpg" alt="LeBrort" style="width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block;"></div>
      <figcaption></figcaption>
    </figure>
    <figure>
      <div class="photo-slot"><img src="assets/TireTech/HappyLube.jpg" alt="Lube" style="width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block;"></div>
      <figcaption>He's so happy to be working in the lube bay</figcaption>
    </figure>
  </div>

  <footer>wandersondata.com is my data portfolio website, but I thought I'd have some fun with it here </footer>
</main>

</body>
</html>
