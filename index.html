<style>
  :root {
    --bg: #0B0B0C;
    --bg-soft: #131314;
    --text: #EDEAE4;
    --muted: #8B9296;
    --accent: #E8A33D;
    --line: #232326;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    background:
      radial-gradient(ellipse 80% 60% at 50% 20%, rgba(232, 163, 61, 0.06), transparent),
      var(--bg);
  }

  .wrap {
    width: 100%;
    max-width: 640px;
    text-align: center;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 28px;
  }

  .eq {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 5px;
    height: 40px;
    margin: 0 auto 28px;
  }

  .eq span {
    display: block;
    width: 4px;
    border-radius: 2px;
    background: var(--accent);
    opacity: 0.85;
    animation: pulse 1.8s ease-in-out infinite;
  }

  .eq span:nth-child(1) { height: 30%; animation-delay: -1.4s; }
  .eq span:nth-child(2) { height: 65%; animation-delay: -0.6s; }
  .eq span:nth-child(3) { height: 100%; animation-delay: -1.9s; }
  .eq span:nth-child(4) { height: 45%; animation-delay: -0.2s; }
  .eq span:nth-child(5) { height: 80%; animation-delay: -1.1s; }
  .eq span:nth-child(6) { height: 35%; animation-delay: -0.8s; }
  .eq span:nth-child(7) { height: 60%; animation-delay: -1.6s; }

  @keyframes pulse {
    0%, 100% { transform: scaleY(0.3); }
    50% { transform: scaleY(1); }
  }

  h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: clamp(2.4rem, 7vw, 4.2rem);
    letter-spacing: 0.01em;
    text-transform: uppercase;
    margin: 0;
    line-height: 1.05;
  }

  .tagline {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    color: var(--muted);
    margin: 18px 0 40px;
    letter-spacing: 0.01em;
  }

  .links {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--text);
    text-decoration: none;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    transition: border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
  }

  .link:hover, .link:focus-visible {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-1px);
  }

  .link:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .link svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

  footer {
    margin-top: 56px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: #4A4E51;
    letter-spacing: 0.04em;
  }

  @media (prefers-reduced-motion: reduce) {
    .eq span { animation: none; transform: scaleY(0.7); }
  }
</style>
